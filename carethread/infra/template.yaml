AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CareThread - Patient-side record for one episode of care (24-hour AWS Hackathon)

# Every function packages the repository root so that `carethread.*` imports
# resolve inside the Lambda. Handlers are therefore fully-qualified module
# paths, not bare `app.handler`.
Globals:
  Function:
    Runtime: python3.11
    Timeout: 60
    MemorySize: 1024
    CodeUri: ../../
    Environment:
      Variables:
        TABLE_NAME: !Ref RecordTable
        DOC_BUCKET: !Ref DocBucket
        CORS_ALLOW_ORIGIN: !Ref WebOrigin
        POWERTOOLS_LOG_LEVEL: INFO

Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20240620-v1:0
    Description: >-
      Bedrock model ID (or inference-profile ID) used for classification and
      clinical extraction. Point this at the newest multimodal Claude model
      enabled in your account.
  WebOrigin:
    Type: String
    Default: "*"
    Description: >-
      Browser origin allowed to call the API. Set this to the Amplify domain
      before submission; the wildcard default is for local development only.
  DemoMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable 30-second reminder schedule compression for demonstrations
  DemoReminderDelaySeconds:
    Type: Number
    Default: 30
    Description: Demo mode reminder countdown delay in seconds

Resources:
  # 1. Canonical Single-Table DynamoDB
  RecordTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: carethread
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # "all documents currently processing", for the UI spinner.
        - IndexName: GSI1
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: PK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 2. S3 Document Storage with EventBridge Enabled
  DocBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub carethread-docs-${AWS::AccountId}
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, POST, HEAD]
            AllowedOrigins: [!Ref WebOrigin]
            AllowedHeaders: ['*']
            MaxAge: 3600

  # 3. Cognito Auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: carethread-user-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: carethread-web-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH

  # 4. HTTP API Gateway with JWT Authorizer
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        AllowOrigins: [!Ref WebOrigin]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  # 5. SNS Notification Topic for Reminders
  ReminderTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: carethread-reminders-topic
      DisplayName: CareThread Care Plan Reminders

  # 6. Reminder Lambda Handler (EventBridge Scheduler -> SNS)
  ReminderFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.modules.reminders.handler.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ReminderTopic
          DEMO_MODE: !Ref DemoMode
          DEMO_REMINDER_DELAY_SECONDS: !Ref DemoReminderDelaySeconds
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt ReminderTopic.TopicName }

  # EventBridge Scheduler needs a role it can assume to invoke ReminderFn.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeReminderFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReminderFn.Arn

  ReminderScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: carethread-reminders

  # 7. API Handlers
  DocumentsApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.api.documents.app.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }
        - S3CrudPolicy: { BucketName: !Ref DocBucket }
      Events:
        CreateDoc:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents
            Method: POST
        GetDoc:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{id}
            Method: GET

  RecordApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.api.record.app.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }
      Events:
        GetRecord:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /record
            Method: GET
        PatchField:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /record/field
            Method: PATCH
        PatchFieldParam:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /record/{field}
            Method: PATCH
        DonePlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /plan/{day}/{slot}/done
            Method: POST

  SubstitutionApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.api.substitution.app.handler
      Timeout: 90
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        # Read-only on the record: substitution never writes a prescription.
        - DynamoDBReadPolicy: { TableName: !Ref RecordTable }
        - S3ReadPolicy: { BucketName: !Ref DocBucket }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
      Events:
        CheckSub:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /substitution
            Method: POST

  # Workflow endpoints (POST /plan/generate, POST /labs/interpret) were part of
  # the API contract but had no deployed function.
  WorkflowsApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.api.workflows.app.handler
      Timeout: 120
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          REMINDER_LAMBDA_ARN: !GetAtt ReminderFn.Arn
          EVENTBRIDGE_SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
        - Statement:
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule]
              Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/carethread-reminders/*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn
      Events:
        GeneratePlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /plan/generate
            Method: POST
        InterpretLabs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /labs/interpret
            Method: POST

  # 8. M1 Ingest Pipeline Lambdas
  RasteriseFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.pipeline.rasterise.app.handler
      Timeout: 120
      MemorySize: 2048
      Policies:
        - S3CrudPolicy: { BucketName: !Ref DocBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }

  ClassifyFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.pipeline.classify.app.handler
      Timeout: 60
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DocBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'

  ExtractFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.pipeline.extract.app.handler
      Timeout: 180
      MemorySize: 2048
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DocBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'

  ValidateFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.pipeline.validate.app.handler
      Timeout: 180
      MemorySize: 2048
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DocBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'

  ConfidenceFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: carethread.pipeline.confidence.app.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RecordTable }

  # 9. Step Functions Ingest State Machine
  IngestPipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: ../pipeline/statemachine/ingest_pipeline.asl.json
      DefinitionSubstitutions:
        RasteriseFnArn: !GetAtt RasteriseFn.Arn
        ClassifyFnArn: !GetAtt ClassifyFn.Arn
        ExtractFnArn: !GetAtt ExtractFn.Arn
        ValidateFnArn: !GetAtt ValidateFn.Arn
        ConfidenceFnArn: !GetAtt ConfidenceFn.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref RasteriseFn }
        - LambdaInvokePolicy: { FunctionName: !Ref ClassifyFn }
        - LambdaInvokePolicy: { FunctionName: !Ref ExtractFn }
        - LambdaInvokePolicy: { FunctionName: !Ref ValidateFn }
        - LambdaInvokePolicy: { FunctionName: !Ref ConfidenceFn }
      Events:
        RawDocumentUpload:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref DocBucket
                object:
                  key:
                    - prefix: raw/
            InputTransformer:
              InputPathsMap:
                bucket: $.detail.bucket.name
                key: $.detail.object.key
              InputTemplate: '{"bucket": <bucket>, "key": <key>}'

Outputs:
  ApiUrl:
    Description: HTTP API Gateway Endpoint URL
    Value: !GetAtt HttpApi.ApiEndpoint
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  ClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref UserPoolClient
  BucketName:
    Description: CareThread S3 Document Bucket Name
    Value: !Ref DocBucket
  ReminderTopicArn:
    Description: CareThread Reminder SNS Topic ARN
    Value: !Ref ReminderTopic
  SchedulerRoleArn:
    Description: Role assumed by EventBridge Scheduler to invoke the reminder function
    Value: !GetAtt SchedulerInvokeRole.Arn
  StateMachineArn:
    Description: Ingest Pipeline State Machine ARN
    Value: !Ref IngestPipelineStateMachine
